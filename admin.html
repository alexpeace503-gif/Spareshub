<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Spares Hub Admin</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>body{font-family:system-ui,sans-serif;background:#f5f0ff}.c{background:#fff;border:1px solid #e9ddff;border-radius:1rem;padding:1rem}.f{width:100%;padding:.65rem;border:1px solid #ddd0f7;border-radius:.7rem;font-size:16px}.b{padding:.4rem .7rem;border-radius:.6rem;font-size:12px;font-weight:700}</style>
</head>
<body class="text-slate-800">
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="c w-full max-w-sm space-y-3">
    <h1 class="text-xl font-extrabold">Spares Hub Admin</h1><p class="text-xs text-slate-500">Owner access only.</p>
    <input id="em" type="email" placeholder="Admin email" class="f"><input id="pw" type="password" placeholder="Password" class="f">
    <button onclick="login()" class="w-full bg-violet-600 text-white font-bold py-3 rounded-xl">Sign in</button>
    <p id="msg" class="text-xs text-rose-600"></p>
  </div>
</div>
<div id="app" class="hidden max-w-3xl mx-auto p-4 space-y-5 pb-20">
  <div class="flex justify-between items-center"><h1 class="text-xl font-extrabold">📊 Spares Hub Admin</h1>
    <div class="flex gap-2"><button onclick="refresh()" class="b bg-violet-100 text-violet-700">↻ Refresh</button><button onclick="logout()" class="b bg-slate-200">Logout</button></div></div>
  <div class="grid grid-cols-2 gap-3" id="stats"></div>
  <div class="c"><h2 class="font-extrabold text-sm mb-3">Visits, last 7 days</h2><div id="chart" class="flex items-end gap-2 h-32"></div></div>
  <div class="c space-y-3"><h2 class="font-extrabold text-sm">💰 Payments</h2>
    <div class="grid grid-cols-2 gap-2"><input id="pShop" placeholder="Shop name" class="f"><input id="pPhone" placeholder="Phone" class="f"><input id="pAmt" type="number" value="299" class="f"><input id="pNote" placeholder="Note (UPI ref)" class="f"></div>
    <button onclick="addPay()" class="bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-sm">+ Record payment</button>
    <div id="pays" class="space-y-2 text-xs"></div></div>
  <div class="c"><h2 class="font-extrabold text-sm mb-3">📣 Leads (7 days)</h2><div id="leads" class="text-xs space-y-1"></div></div>
  <div class="c"><h2 class="font-extrabold text-sm mb-3">⚑ Reports</h2><div id="reps" class="space-y-2 text-xs"></div></div>
  <div class="c space-y-3"><h2 class="font-extrabold text-sm">🤝 Shops outreach</h2>
    <div class="grid grid-cols-2 gap-2"><input id="oShop" placeholder="Shop name" class="f"><input id="oPhone" placeholder="Phone" class="f"><input id="oCity" placeholder="City / area" class="f"><input id="oNote" placeholder="Note" class="f"></div>
    <button onclick="addOut()" class="bg-violet-600 text-white font-bold px-4 py-2 rounded-xl text-sm">+ Add shop</button>
    <p id="osum" class="text-xs text-slate-500"></p><div id="outs" class="space-y-2 text-xs"></div></div>
  <div class="c"><h2 class="font-extrabold text-sm mb-3">📦 Listings</h2><div id="ls" class="space-y-2 text-xs"></div></div>
  <div class="c"><h2 class="font-extrabold text-sm mb-3">📋 Wanted requests</h2><div id="rs" class="space-y-2 text-xs"></div></div>
</div>
<script>
const db=window.supabase.createClient('https://xtkydfbjfnimaglovzzg.supabase.co','sb_publishable_HwKGCDcpsEIfq5k-d14Igg_3F-sPDoo');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=t=>{$('msg').textContent=t};
let LS=[],RS=[];
async function init(){const {data:{session}}=await db.auth.getSession();if(session)await enter()}
async function login(){msg('');const {error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)return msg(error.message);await enter()}
async function enter(){
  const {data:{user}}=await db.auth.getUser();if(!user)return;
  const {data}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();
  if(!data){await db.auth.signOut();return msg('This account is not an admin.')}
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  const ch=db.channel('online');ch.on('presence',{event:'sync'},()=>{const e=$('online');if(e)e.textContent=Object.keys(ch.presenceState()).length}).subscribe();
  refresh();setInterval(refresh,60000);
}
async function logout(){await db.auth.signOut();location.reload()}
const card=(t,v,id)=>`<div class="c"><p class="text-[11px] text-slate-500">${t}</p><p class="text-2xl font-black text-violet-700" ${id?`id="${id}"`:''}>${v}</p></div>`;
async function refresh(){
  const day=new Date();day.setHours(0,0,0,0);const wk=new Date(day);wk.setDate(wk.getDate()-6);
  const [v,l,r,p]=await Promise.all([
    db.from('visits').select('visitor,ref,created_at').gte('created_at',wk.toISOString()).order('created_at',{ascending:false}).limit(5000),
    db.from('listings').select('*').order('id',{ascending:false}).limit(500),
    db.from('requests').select('*').order('id',{ascending:false}).limit(300),
    db.from('payments').select('*').order('paid_at',{ascending:false}).limit(200)]);
  const vs=v.data||[];LS=l.data||[];RS=r.data||[];const ps=p.data||[];
  const today=vs.filter(x=>new Date(x.created_at)>=day);
  const uniq=a=>new Set(a.map(x=>x.visitor)).size;
  const insta=vs.filter(x=>(x.ref||'').toLowerCase().includes('instagram')).length;
  const real=LS.filter(x=>!x.demo),newToday=real.filter(x=>x.id>=day.getTime()).length;
  const m0=new Date(day.getFullYear(),day.getMonth(),1);
  const rev=ps.reduce((a,x)=>a+x.amount,0),revM=ps.filter(x=>new Date(x.paid_at)>=m0).reduce((a,x)=>a+x.amount,0);
  const cur=$('online')?$('online').textContent:'0';
  $('stats').innerHTML=card('🟢 Online now',cur,'online')+card('Visitors today',uniq(today))+card('Visits today',today.length)+card('Unique visitors (7d)',uniq(vs))+card('From Instagram (7d)',insta)+card('Real listings',real.length+' <span class="text-xs font-normal text-slate-400">(+'+newToday+' today)</span>')+card('Wanted requests',RS.filter(x=>!x.demo).length)+card('Revenue (this month / total)','₹'+revM+' / ₹'+rev);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(wk);d.setDate(wk.getDate()+i);return d});
  const cnt=days.map(d=>vs.filter(x=>{const t=new Date(x.created_at);return t>=d&&t<new Date(d.getTime()+864e5)}).length),mx=Math.max(1,...cnt);
  $('chart').innerHTML=days.map((d,i)=>`<div class="flex-1 flex flex-col items-center justify-end h-full"><span class="text-[10px] font-bold">${cnt[i]}</span><div class="w-full bg-gradient-to-t from-violet-600 to-fuchsia-400 rounded-t" style="height:${Math.max(4,cnt[i]/mx*85)}%"></div><span class="text-[10px] text-slate-400">${d.toLocaleDateString('en',{weekday:'short'})}</span></div>`).join('');
  $('pays').innerHTML=ps.map(x=>`<div class="flex justify-between border-b border-violet-50 pb-1"><span>${esc(x.shop)} ${esc(x.phone)}<br><span class="text-slate-400">${new Date(x.paid_at).toLocaleDateString()} ${esc(x.note)}</span></span><b>₹${x.amount}</b></div>`).join('')||'<p class="text-slate-400">No payments yet.</p>';
  $('ls').innerHTML=LS.map(x=>`<div class="flex justify-between gap-2 border-b border-violet-50 pb-2"><div class="min-w-0"><b>${esc(x.title)}</b>${x.demo?' <span class="text-amber-600">[sample]</span>':''}<br>${esc(x.shop)} • ${esc(x.city)} • ₹${x.price}<br><span class="text-slate-400">+${esc(x.phone)}</span></div><div class="flex gap-1 shrink-0 items-start"><button onclick="verify(${x.id},${!x.verified})" class="b ${x.verified?'bg-emerald-100 text-emerald-700':'bg-slate-100'}">${x.verified?'✔ Verified':'Verify'}</button><button onclick="del('listings',${x.id})" class="b bg-rose-100 text-rose-600">Delete</button></div></div>`).join('');
  $('rs').innerHTML=RS.map(x=>`<div class="flex justify-between gap-2 border-b border-violet-50 pb-2"><div class="min-w-0"><b>${esc(x.item)}</b>${x.demo?' <span class="text-amber-600">[sample]</span>':''}<br>${esc(x.shop)} • ${esc(x.city)}<br><span class="text-slate-400">+${esc(x.phone)}</span></div><button onclick="del('requests',${x.id})" class="b bg-rose-100 text-rose-600 h-fit">Delete</button></div>`).join('');
  loadExtra();
}
let OUT=[];
const ST=[['to_contact','To contact'],['contacted','Contacted'],['replied','Replied'],['listed','Listed ✅']];
async function loadExtra(){
  const wk=new Date();wk.setDate(wk.getDate()-6);wk.setHours(0,0,0,0);
  const [c,rp,o]=await Promise.all([db.from('clicks').select('kind,ref_id').gte('created_at',wk.toISOString()).limit(5000),db.from('reports').select('*').order('created_at',{ascending:false}).limit(100),db.from('outreach').select('*').order('updated_at',{ascending:false}).limit(300)]);
  const cs=c.data||[],reps=rp.data||[];OUT=o.data||[];
  const by=k=>cs.filter(x=>x.kind===k).length,top={};
  cs.filter(x=>x.kind!=='paywall').forEach(x=>{const k=(x.kind==='wa_request'?'r':'l')+x.ref_id;top[k]=(top[k]||0)+1});
  const nm=(t,id)=>{const x=(t==='l'?LS:RS).find(y=>y.id===Number(id));return x?esc(x.title||x.item):'(deleted)'};
  const rows=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>`<div class="flex justify-between border-b border-violet-50 pb-1"><span>${nm(k[0],k.slice(1))}</span><b>${n}</b></div>`).join('');
  $('leads').innerHTML=`<div class="grid grid-cols-3 gap-2 mb-2">${card('WhatsApp',by('wa_listing')+by('wa_request'))}${card('Calls',by('call_listing'))}${card('Paywall views',by('paywall'))}</div>`+(rows||'<p class="text-slate-400">No clicks yet.</p>');
  $('reps').innerHTML=reps.map(x=>`<div class="border-b border-violet-50 pb-2"><b>${nm(x.kind==='listing'?'l':'r',x.ref_id)}</b><br><span class="text-slate-500">"${esc(x.reason)}"</span><div class="flex gap-1 mt-1"><button onclick="delReport(${x.id},'${x.kind}',${x.ref_id})" class="b bg-rose-100 text-rose-600">Delete item</button><button onclick="dismiss(${x.id})" class="b bg-slate-100">Dismiss</button></div></div>`).join('')||'<p class="text-slate-400">No reports.</p>';
  $('osum').textContent=ST.map(s=>s[1]+': '+OUT.filter(x=>x.status===s[0]).length).join('  •  ');
  $('outs').innerHTML=OUT.map(x=>`<div class="border-b border-violet-50 pb-2"><b>${esc(x.shop)}</b> <span class="text-slate-400">${esc(x.city)} ${esc(x.phone)}</span><br><span class="text-slate-500">${esc(x.note)}</span><div class="flex gap-1 mt-1 items-center"><select onchange="setSt(${x.id},this.value)" class="border rounded-lg p-1 text-xs">${ST.map(s=>`<option value="${s[0]}" ${x.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select>${x.phone?`<a target="_blank" href="https://wa.me/91${esc(String(x.phone).replace(/\D/g,'').slice(-10))}" class="b bg-emerald-100 text-emerald-700">WhatsApp</a>`:''}<button onclick="delOut(${x.id})" class="b bg-rose-100 text-rose-600">✕</button></div></div>`).join('');
}
async function addOut(){const s=$('oShop').value.trim();if(!s)return alert('Enter shop name');
  const {error}=await db.from('outreach').insert({shop:s,phone:$('oPhone').value.trim(),city:$('oCity').value.trim(),note:$('oNote').value.trim()});
  if(error)return alert(error.message);['oShop','oPhone','oCity','oNote'].forEach(i=>$(i).value='');loadExtra()}
async function setSt(id,v){await db.from('outreach').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);loadExtra()}
async function delOut(id){if(!confirm('Remove this shop?'))return;await db.from('outreach').delete().eq('id',id);loadExtra()}
async function dismiss(id){await db.from('reports').delete().eq('id',id);loadExtra()}
async function delReport(id,kind,ref){if(!confirm('Delete the reported item?'))return;await db.from(kind==='listing'?'listings':'requests').delete().eq('id',ref);await db.from('reports').delete().eq('id',id);refresh()}
async function verify(id,val){const {error}=await db.from('listings').update({verified:val}).eq('id',id);if(error)alert(error.message);refresh()}
async function del(t,id){if(!confirm('Delete permanently?'))return;const {error}=await db.from(t).delete().eq('id',id);if(error)alert(error.message);refresh()}
async function addPay(){const amt=Number($('pAmt').value);if(!amt)return alert('Enter amount');
  const {error}=await db.from('payments').insert({shop:$('pShop').value.trim(),phone:$('pPhone').value.trim(),amount:amt,note:$('pNote').value.trim()});
  if(error)return alert(error.message);['pShop','pPhone','pNote'].forEach(i=>$(i).value='');refresh()}
init();
</script>
</body>
</html>
